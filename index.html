<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forsaken 3D - Play as Killer or Survivor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; user-select: none; }

        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0);
            transition: box-shadow 0.3s ease;
        }

        /* HUD ATAS */
        #top-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.75); padding: 8px 24px; border-radius: 8px;
            border: 2px solid #555; z-index: 10; color: #fff;
        }
        #round-timer { font-size: 24px; font-weight: bold; color: #ffcc00; letter-spacing: 2px; }

        /* TOMBOL PILIH ROLE DI LOBBY */
        #role-btn {
            background: #0055ff; color: #fff; border: 2px solid #fff;
            padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 13px;
            cursor: pointer; display: block;
        }
        #role-btn.killer { background: #cc0000; }

        /* STATUS EFFECTS DI KIRI TENGAH */
        #status-effects {
            position: absolute; top: 30%; left: 20px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 15; pointer-events: none;
        }
        .effect-badge {
            background: rgba(0, 0, 0, 0.8); border-left: 5px solid #fff;
            padding: 6px 14px; border-radius: 4px; color: #fff;
            font-weight: bold; font-size: 13px; letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6); min-width: 130px;
        }

        #highlight-warning {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 200, 0, 0.85); color: #000; font-weight: 900;
            padding: 6px 16px; border-radius: 20px; font-size: 13px; letter-spacing: 1px;
            display: none; z-index: 12; animation: blink 0.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.7; } to { opacity: 1; } }

        #player-bars {
            position: absolute; bottom: 25px; left: 25px;
            background: rgba(0, 0, 0, 0.75); padding: 10px 14px; border-radius: 8px;
            border: 2px solid #444; width: 170px; z-index: 10; color: #fff;
            display: none;
        }
        .bar-container { background: #222; height: 12px; border-radius: 4px; overflow: hidden; margin-top: 3px; }
        #hp-bar { width: 100%; height: 100%; background: #00e64d; transition: width 0.2s; }
        #stamina-bar { width: 100%; height: 100%; background: #ffaa00; transition: width 0.1s; }
        .bar-title { font-size: 10px; font-weight: bold; margin-top: 3px; }

        /* PANEL SPECTATE & PERSENTASE DARAH AI */
        #spectate-panel {
            position: absolute; top: 48%; left: 20px; transform: translateY(-50%);
            display: none; flex-direction: column; gap: 8px; z-index: 25;
        }
        #spectate-btn {
            background: #111; color: #00e6ff; border: 2px solid #00e6ff;
            padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
            cursor: pointer; box-shadow: 0 0 10px rgba(0, 230, 255, 0.4);
        }
        #spectate-btn:hover { background: #00e6ff; color: #000; }
        #spectate-info { color: #fff; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #ai-hp-list {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #444; border-radius: 6px;
            padding: 8px 12px; color: #fff; font-size: 12px; display: flex; flex-direction: column; gap: 4px;
        }

        #lms-banner {
            position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%);
            font-size: 42px; font-weight: 900; color: #ff0000; letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0000, 0 0 35px #000; display: none; z-index: 20;
            text-align: center; animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.08); } }

        /* SKILL UI SURVIVOR & KILLER */
        #skills-container {
            position: absolute; bottom: 20px; right: 25px; width: 220px; height: 210px;
            z-index: 10; display: none;
        }
        .brush-circle {
            position: absolute; border-radius: 50%; background: #0a101d;
            border: 3px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; text-align: center; cursor: pointer;
        }
        .skill-name {
            position: absolute; bottom: -16px; font-size: 10px; font-weight: bold;
            white-space: nowrap; color: #fff; text-shadow: 1px 1px 3px #000;
        }
        .cd-dark {
            position: absolute; top: 0; left: 0; width: 100%; height: 0%;
            background: rgba(0, 0, 0, 0.7); border-radius: 50%; pointer-events: none;
        }

        #btn-s1 { width: 56px; height: 56px; top: 5px; right: 8px; }
        #btn-s2 { width: 60px; height: 60px; top: 5px; left: 55px; }
        #btn-s3 { width: 56px; height: 56px; bottom: 35px; left: 5px; }
        #btn-sprint { width: 80px; height: 80px; bottom: 28px; right: 25px; }
        #btn-shiftlock { width: 36px; height: 36px; bottom: -6px; left: 82px; background: #111; }
        #btn-shiftlock.active { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; border: 2px solid #00ffcc; border-radius: 50%;
            pointer-events: none; display: none; z-index: 15;
        }

        #start-hint {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9); font-size: 14px; z-index: 10;
            background: rgba(180, 0, 0, 0.75); padding: 7px 16px; border-radius: 20px;
            font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="highlight-warning">⚠ TERDETEKSI KILLER (HIGHLIGHT) ⚠</div>
    <div id="status-effects"></div>

    <!-- AUDIO ASSETS -->
    <audio id="chase-layer1" loop preload="auto"><source src="layer1.mp3" type="audio/mpeg"></audio>
    <audio id="chase-layer2" loop preload="auto"><source src="layer2.mp3" type="audio/mpeg"></audio>
    <audio id="chase-layer3" loop preload="auto"><source src="layer3.mp3" type="audio/mpeg"></audio>
    <audio id="chase-layer4" loop preload="auto"><source src="layer4.mp3" type="audio/mpeg"><source src="chase.mp3" type="audio/mpeg"></audio>
    <audio id="audio-lms" loop preload="auto"><source src="lms.mp3" type="audio/mpeg"></audio>
    <audio id="audio-ambience" loop preload="auto"><source src="ambience.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-cola" preload="auto"><source src="cola.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-slate" preload="auto"><source src="slate.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-burger" preload="auto"><source src="burger.mp3" type="audio/mpeg"></audio>

    <div id="player-bars">
        <div id="hp-title" class="bar-title">HEALTH</div>
        <div id="hp-container" class="bar-container"><div id="hp-bar"></div></div>
        <div class="bar-title">STAMINA</div>
        <div class="bar-container"><div id="stamina-bar"></div></div>
    </div>

    <div id="top-hud">
        <div id="round-timer">LOBBY: 15s</div>
        <button id="role-btn" onclick="togglePlayerRole()">PERAN: SURVIVOR (Klik Ganti)</button>
    </div>

    <div id="spectate-panel">
        <button id="spectate-btn" onclick="cycleSpectate()">SPECTATE</button>
        <div id="spectate-info">Spectating: AI Noob 1</div>
        <div id="ai-hp-list"></div>
    </div>

    <div id="lms-banner">LAST MAN STANDING!</div>
    <div id="start-hint">🔊 KLIK LAYAR UNTUK MULAI & SUARA | Tekan [M] Unlock Mouse</div>

    <div id="skills-container">
        <div id="btn-s1" class="brush-circle" onclick="useSkill1()">
            <div id="cd-q" class="cd-dark"></div>
            <div id="icon-s1" style="font-size:18px;font-weight:bold;">Q</div>
            <div id="label-s1" class="skill-name">Ghostburger [Q]</div>
        </div>

        <div id="btn-s2" class="brush-circle" onclick="useSkill2()">
            <div id="cd-e" class="cd-dark"></div>
            <div id="icon-s2" style="font-size:18px;font-weight:bold;">E</div>
            <div id="label-s2" class="skill-name">Slateskin [E]</div>
        </div>

        <div id="btn-s3" class="brush-circle" onclick="useSkill3()">
            <div id="cd-r" class="cd-dark"></div>
            <div id="icon-s3" style="font-size:18px;font-weight:bold;">R</div>
            <div id="label-s3" class="skill-name">Bloxy Cola [R]</div>
        </div>

        <div id="btn-sprint" class="brush-circle" onclick="useBasicAttack()">
            <div id="cd-m1" class="cd-dark"></div>
            <div id="icon-sprint" style="font-size:16px;font-weight:bold;">SHIFT</div>
            <div id="label-sprint" class="skill-name" style="bottom: 4px; font-size: 9px;">SPRINT</div>
        </div>

        <div id="btn-shiftlock" class="brush-circle" onclick="toggleShiftlock()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <circle cx="12" cy="12" r="6"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            </svg>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // =========================================================================
        // 1. STATUS EFFECTS & ROLE TOGGLE
        // =========================================================================
        let playerRole = "SURVIVOR"; // "SURVIVOR" atau "KILLER"

        function togglePlayerRole() {
            if (gameState !== "LOBBY") return;
            playerRole = (playerRole === "SURVIVOR") ? "KILLER" : "SURVIVOR";
            const btn = document.getElementById("role-btn");
            btn.innerText = "PERAN: " + playerRole + " (Klik Ganti)";
            btn.classList.toggle("killer", playerRole === "KILLER");
        }

        const activeEffects = {};
        const effectsContainer = document.getElementById("status-effects");

        function addStatusEffect(key, label, color, durationSec) {
            if (activeEffects[key]) {
                clearInterval(activeEffects[key].interval);
                activeEffects[key].el.remove();
            }
            const el = document.createElement("div");
            el.className = "effect-badge";
            el.style.borderLeftColor = color;
            el.style.color = color;
            effectsContainer.appendChild(el);

            let timeLeft = durationSec;
            el.innerText = `${label} (${timeLeft}s)`;

            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) removeStatusEffect(key);
                else el.innerText = `${label} (${timeLeft}s)`;
            }, 1000);
            activeEffects[key] = { el, interval };
        }

        function removeStatusEffect(key) {
            if (activeEffects[key]) {
                clearInterval(activeEffects[key].interval);
                activeEffects[key].el.remove();
                delete activeEffects[key];
            }
        }

        function clearAllEffects() { Object.keys(activeEffects).forEach(removeStatusEffect); }

        // =========================================================================
        // 2. AUDIO ENGINE (UNLOCK ALL LAYERS ON CLICK -> LAYER 4 PASTI NYALA)
        // =========================================================================
        let isAudioInit = false;
        const l1 = document.getElementById("chase-layer1");
        const l2 = document.getElementById("chase-layer2");
        const l3 = document.getElementById("chase-layer3");
        const l4 = document.getElementById("chase-layer4");
        const bgmLMS = document.getElementById("audio-lms");
        const bgmAmbience = document.getElementById("audio-ambience");
        const sfxCola = document.getElementById("sfx-cola");
        const sfxSlate = document.getElementById("sfx-slate");
        const sfxBurger = document.getElementById("sfx-burger");

        let activeLayerIndex = 0;

        function unlockAllAudio() {
            if (isAudioInit) return;
            isAudioInit = true;
            [l1, l2, l3, l4, bgmLMS, bgmAmbience, sfxCola, sfxSlate, sfxBurger].forEach(a => {
                if (a) {
                    a.volume = 0;
                    a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(()=>{});
                }
            });
            if (gameState === "INGAME") startRoundAudio();
        }

        function playSFX(el) {
            if (el && el.readyState >= 1) {
                el.volume = 1.0; el.currentTime = 0; el.play().catch(()=>{});
            }
        }

        function stopAndResetAllAudio() {
            [l1, l2, l3, l4, bgmLMS, bgmAmbience].forEach(a => {
                if (a) { a.pause(); a.currentTime = 0; }
            });
            activeLayerIndex = 0;
            document.getElementById("vignette").style.boxShadow = "inset 0 0 0px rgba(255,0,0,0)";
        }

        function startRoundAudio() {
            if (!isAudioInit) return;
            stopAndResetAllAudio();
            if (bgmAmbience) { bgmAmbience.volume = 0.4; bgmAmbience.play().catch(()=>{}); }
        }

        function switchSingleLayer(targetLayer) {
            if (activeLayerIndex === targetLayer) return;
            [l1, l2, l3, l4].forEach(l => {
                if (l && !l.paused) { l.pause(); l.currentTime = 0; }
            });
            activeLayerIndex = targetLayer;

            const layers = [null, l1, l2, l3, l4];
            const chosen = layers[targetLayer];
            if (chosen) {
                chosen.currentTime = 0;
                chosen.volume = 1.0;
                chosen.play().catch(()=>{});
            }
        }

        function update4LayerChase(dist) {
            if (!isAudioInit || gameState !== "INGAME") return;
            const vignette = document.getElementById("vignette");

            if (lmsTriggered) {
                [l1, l2, l3, l4].forEach(l => { if (l && !l.paused) { l.pause(); l.currentTime = 0; } });
                activeLayerIndex = 0;
                if (bgmAmbience && !bgmAmbience.paused) bgmAmbience.volume = 0.05;

                if (bgmLMS && bgmLMS.paused) {
                    bgmLMS.currentTime = 0; bgmLMS.volume = 1.0; bgmLMS.play().catch(()=>{});
                }
                vignette.style.boxShadow = "inset 0 0 120px rgba(255, 0, 0, 0.7)";
                return;
            } else {
                if (bgmLMS && !bgmLMS.paused) bgmLMS.pause();
            }

            if (dist > 80) {
                switchSingleLayer(0);
                if (bgmAmbience) bgmAmbience.volume = 0.45;
                vignette.style.boxShadow = "inset 0 0 0px rgba(255,0,0,0)";
            } else if (dist > 55) {
                switchSingleLayer(1);
                if (bgmAmbience) bgmAmbience.volume = 0.3;
                vignette.style.boxShadow = "inset 0 0 50px rgba(255, 0, 0, 0.15)";
            } else if (dist > 36) {
                switchSingleLayer(2);
                if (bgmAmbience) bgmAmbience.volume = 0.2;
                vignette.style.boxShadow = "inset 0 0 80px rgba(255, 0, 0, 0.35)";
            } else if (dist > 22) {
                switchSingleLayer(3);
                if (bgmAmbience) bgmAmbience.volume = 0.1;
                vignette.style.boxShadow = "inset 0 0 110px rgba(255, 0, 0, 0.55)";
            } else {
                switchSingleLayer(4); // Jarak <= 22: LAYER 4 PASTI MENYALA!
                if (bgmAmbience) bgmAmbience.volume = 0.05;
                vignette.style.boxShadow = "inset 0 0 140px rgba(255, 0, 0, 0.85)";
            }
        }

        // =========================================================================
        // 3. 3D SCENE, OPTIMIZED SHADOWS & OBOR (RINGAN 60 FPS DI CHROMEBOOK!)
        // =========================================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x14151f, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap; // Ringan & cepat untuk Chromebook
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x666677, 1.0);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0xaaccff, 0.9);
        moonLight.position.set(60, 100, 60);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 10;
        moonLight.shadow.camera.far = 300;
        moonLight.shadow.camera.left = -125; moonLight.shadow.camera.right = 125;
        moonLight.shadow.camera.top = 125; moonLight.shadow.camera.bottom = -125;
        scene.add(moonLight);

        const arenaFloor = new THREE.Mesh(new THREE.PlaneGeometry(250, 250), new THREE.MeshStandardMaterial({ color: 0x203220, roughness: 0.9 }));
        arenaFloor.rotation.x = -Math.PI / 2;
        arenaFloor.receiveShadow = true;
        scene.add(arenaFloor);

        const lobbyPlatform = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 50), new THREE.MeshStandardMaterial({ color: 0x554433 }));
        lobbyPlatform.position.set(0, 70, 0);
        lobbyPlatform.receiveShadow = true;
        scene.add(lobbyPlatform);

        const solidBoxes = [];
        function registerBox(x, z, w, d) {
            solidBoxes.push({ minX: x - w/2 - 1.2, maxX: x + w/2 + 1.2, minZ: z - d/2 - 1.2, maxZ: z + d/2 + 1.2 });
        }

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a28, roughness: 0.9 });
        function createBorderWall(x, z, w, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 22, d), wallMat);
            wall.position.set(x, 11, z);
            wall.castShadow = true; wall.receiveShadow = true;
            scene.add(wall);
            registerBox(x, z, w, d);
        }
        createBorderWall(0, -125, 250, 6);
        createBorderWall(0, 125, 250, 6);
        createBorderWall(-125, 0, 6, 250);
        createBorderWall(125, 0, 6, 250);

        const torchLights = [];
        function attachTorchToWall(wx, wy, wz) {
            const torchGroup = new THREE.Group();
            const stick = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.4, 0.25), new THREE.MeshStandardMaterial({ color: 0x4d3319 }));
            stick.rotation.x = 0.4; torchGroup.add(stick);

            const flame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), new THREE.MeshBasicMaterial({ color: 0xff7700 }));
            flame.position.set(0, 0.7, 0.3); torchGroup.add(flame);

            const light = new THREE.PointLight(0xff6600, 2.2, 28);
            light.position.set(0, 0.8, 0.5);
            torchGroup.add(light);
            torchLights.push(light);

            torchGroup.position.set(wx, wy, wz);
            scene.add(torchGroup);
        }

        for(let i = 0; i < 20; i++) {
            const h = 8 + Math.random() * 8;
            const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), new THREE.MeshStandardMaterial({ color: 0x333340 }));
            const bx = (Math.random() - 0.5) * 165;
            const bz = (Math.random() - 0.5) * 165;
            b.position.set(bx, h/2, bz);
            b.castShadow = true; b.receiveShadow = true;
            scene.add(b);
            registerBox(bx, bz, 8, 8);

            if (i % 3 === 0) attachTorchToWall(bx, 5, bz + 4.2);
        }

        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1e5922 });
        for(let i = 0; i < 30; i++) {
            const tx = (Math.random() - 0.5) * 185;
            const tz = (Math.random() - 0.5) * 185;
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 7, 1.2), trunkMat);
            trunk.position.set(tx, 3.5, tz); trunk.castShadow = true; scene.add(trunk);

            const foliage = new THREE.Mesh(new THREE.BoxGeometry(4.5, 4.5, 4.5), foliageMat);
            foliage.position.set(tx, 8, tz); foliage.castShadow = true; scene.add(foliage);
            registerBox(tx, tz, 1.2, 1.2);
        }

        function canMoveTo(x, z) {
            for (let b of solidBoxes) {
                if (x >= b.minX && x <= b.maxX && z >= b.minZ && z <= b.maxZ) return false;
            }
            return true;
        }

        function moveWithCollision(entity, vx, vz) {
            const nextX = entity.position.x + vx;
            const nextZ = entity.position.z + vz;
            if (canMoveTo(nextX, nextZ)) {
                entity.position.x = nextX; entity.position.z = nextZ;
            } else if (canMoveTo(nextX, entity.position.z)) {
                entity.position.x = nextX;
            } else if (canMoveTo(entity.position.x, nextZ)) {
                entity.position.z = nextZ;
            }
        }

        // ==========================================
        // 4. MODEL R6 NOOB & C00LKIDD
        // ==========================================
        function createFace(isRed) {
            const c = document.createElement("canvas"); c.width = 128; c.height = 128;
            const ctx = c.getContext("2d");
            ctx.fillStyle = isRed ? "#ff0000" : "#ffd200";
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(40, 45, 8, 0, Math.PI*2); ctx.arc(88, 45, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(64, 75, isRed ? 30 : 22, 0, Math.PI, false); ctx.lineWidth = 6; ctx.stroke();
            return new THREE.CanvasTexture(c);
        }

        function createC00lkiddTorsoTexture() {
            const c = document.createElement("canvas"); c.width = 256; c.height = 256;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "#cc0000"; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = "#111111"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("team c00lkidd", 128, 100);
            ctx.fillText("join today!", 128, 150);
            return new THREE.CanvasTexture(c);
        }

        function createSword() {
            const sword = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.5, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 }));
            blade.position.y = 1.3; blade.castShadow = true; sword.add(blade);
            const cross = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.2), new THREE.MeshStandardMaterial({ color: 0x880000 }));
            cross.position.y = 0.1; sword.add(cross);
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            handle.position.y = -0.25; sword.add(handle);
            return sword;
        }

        function createR6(isRed) {
            const g = new THREE.Group();
            const mBody = isRed ? new THREE.MeshStandardMaterial({ color: 0xcc0000 }) : new THREE.MeshStandardMaterial({ color: 0x0055ff });
            const mLimb = new THREE.MeshStandardMaterial({ color: isRed ? 0x990000 : 0xffd200 });
            const mLeg  = new THREE.MeshStandardMaterial({ color: isRed ? 0x990000 : 0x287f46 });

            let torsoMat = mBody;
            if (isRed) torsoMat = [mBody, mBody, mBody, mBody, mBody, new THREE.MeshStandardMaterial({ map: createC00lkiddTorsoTexture() })];

            if (dx !== 0 || dy !== 0) {

        // ==========================================

        setInterval(() => {

                aiSurvivors.forEach(ai => { if (ai.alive) aliveCount++; });

                updateSpectateHPList();

                if (aliveCount === 1 && !lmsTriggered && ((playerRole === "SURVIVOR" && !isPlayerDead) || playerRole === "KILLER")) {

        // =========================================================================

        let keys = {};

        function toggleShiftlock() {

        window.addEventListener("keydown", (e) => {

        // Dispatcer Skill berdasarkan Role
        function useSkill1() { if (playerRole === "SURVIVOR") useBurger(); else killerWalkspeedOverride(); }
        function useSkill2() { if (playerRole === "SURVIVOR") useSlate(); else killerCorruptNature(); }
        function useSkill3() { if (playerRole === "SURVIVOR") useCola(); else killerPizzaDelivery(); }
        function useBasicAttack() { if (playerRole === "KILLER") killerTagM1(); }

        // --- SKILL SURVIVOR ---
        function playConsumeAnimation(itemColor, onComplete) {
            isDrinkingOrEating = true;
            playerNoob.parts.heldItem.material.color.setHex(itemColor);
            playerNoob.parts.heldItem.visible = true;
            playerNoob.parts.rArm.rotation.x = 2.2; playerNoob.parts.rArm.rotation.z = -0.4;

                playerNoob.parts.lArm.rotation.x = 0; playerNoob.parts.lArm.rotation.z = 0;
                isDrinkingOrEating = false;
                if (onComplete) onComplete();
            }, 1400);
        }

        function useBurger() {
            if (cdQ || isDrinkingOrEating || isPlayerDead || gameState !== "INGAME") return;
            cdQ = true; animateCD("cd-q", 40, () => { cdQ = false; });
            playSFX(sfxBurger);
            playConsumeAnimation(0xd4a373, () => {
                const healAmount = Math.max(6, (100 - playerNoob.hp) * 0.25);
                playerNoob.hp = Math.min(100, playerNoob.hp + healAmount);
                document.getElementById("hp-bar").style.width = playerNoob.hp + "%";
                addStatusEffect("invis", "INVISIBLE", "#00ccff", 7);
                Object.values(playerNoob.parts).forEach(p => { if (p.material) { p.material.transparent = true; p.material.opacity = 0.15; } });
                setTimeout(() => { Object.values(playerNoob.parts).forEach(p => { if (p.material) p.material.opacity = 1; }); }, 7000);
            });
        }

        function revertSlateAppearance() {
            playerNoob.parts.torso.material.color.setHex(0x0055ff);
            playerNoob.parts.head.material.color.setHex(0xffd200);
            playerNoob.parts.lArm.material.color.setHex(0xffd200); playerNoob.parts.rArm.material.color.setHex(0xffd200);
            playerNoob.parts.lLeg.material.color.setHex(0x287f46); playerNoob.parts.rLeg.material.color.setHex(0x287f46);

        function useSlate() {
            if (playerNoob.isInvulnerable) {
                clearTimeout(slateTimerId); playerNoob.isInvulnerable = false; removeStatusEffect("slate"); revertSlateAppearance();
                if (playerNoob.position.distanceTo(c00lkidd.position) < 18) {

                speedBoostMultiplier = 1.5; addStatusEffect("speed", "SPEED I", "#00ffcc", 2);

        // --- SKILL PLAYER JIKA MEMILIH KILLER ---
        function killerTagM1() {
            if (cdM1 || c00lState !== "IDLE" || gameState !== "INGAME") return;
            cdM1 = true; animateCD("cd-m1", 2, () => { cdM1 = false; });
            c00lkidd.parts.rArm.rotation.x = -1.6;

            triggerWalkspeedOverride();

            if (cdE || c00lState !== "IDLE" || gameState !== "INGAME") return;
            cdE = true; animateCD("cd-e", 12, () => { cdE = false; });
            const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), c00lkidd.rotation.y);
            const aimTarget = { position: c00lkidd.position.clone().addScaledVector(fwd, 20) };
            triggerCorruptNature(aimTarget);
        }

        function killerPizzaDelivery() {
            if (cdR || c00lState !== "IDLE" || gameState !== "INGAME" || minions.length >= 2) return;
            cdR = true; animateCD("cd-r", 50, () => { cdR = false; });
            triggerPizzaDelivery();
        }

        function animateCD(elemId, duration, onComplete) {
            const el = document.getElementById(elemId);
            el.style.height = "100%";
            let t = 0;
            const timer = setInterval(() => {
                t += 0.2;
                el.style.height = Math.max(0, (1 - (t / duration)) * 100) + "%";
                if (t >= duration) { clearInterval(timer); if (onComplete) onComplete(); }
            }, 200);
        }

        function applyHighlight(target) {
            target.isHighlighted = true;
            target.parts.highlightMesh.visible = true;
            if (target === playerNoob && playerRole === "SURVIVOR") document.getElementById("highlight-warning").style.display = "block";
            setTimeout(() => {
                target.isHighlighted = false; target.parts.highlightMesh.visible = false;
                if (target === playerNoob) document.getElementById("highlight-warning").style.display = "none";
            }, 7500);
        }

        // =========================================================================
        // 8. ANIMASI C00LKIDD & ABILITIES SHARED (AI MAUPUN PLAYER)
        // =========================================================================
        let c00lState = "IDLE";
        let dashTimer = 0;
        let c00lAbilitiesTimer = 0;

        function triggerWalkspeedOverride() {
            c00lState = "OVERRIDE_WINDUP";
            c00lkidd.parts.torso.rotation.x = 0.5; c00lkidd.parts.lArm.rotation.x = 0.8; c00lkidd.parts.rArm.rotation.x = 0.8;
            setTimeout(() => { c00lState = "DASHING"; dashTimer = 40; c00lkidd.parts.torso.rotation.x = 0; }, 500);
        }

        function triggerCorruptNature(target) {
            c00lState = "CASTING";
            c00lkidd.parts.rArm.rotation.x = -2.2;
            setTimeout(() => {
                c00lkidd.parts.rArm.rotation.x = -0.5;
                const proj = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), new THREE.MeshStandardMaterial({ color: 0x990000, transparent: true, opacity: 0.8 }));
                proj.position.copy(c00lkidd.position); proj.position.y += 3; scene.add(proj);

                const dir = target.position.clone().sub(c00lkidd.position).normalize();
                let life = 120; let hitDone = false;

                const intv = setInterval(() => {
                    proj.position.addScaledVector(dir, 1.1); life--;
                    const allTargets = (playerRole === "KILLER") ? [playerNoob, ...aiSurvivors] : [playerNoob, ...aiSurvivors];

                    for (let t of allTargets) {
                        if (!hitDone && t.alive && proj.position.distanceTo(t.position) < 3.2) {
                            hitDone = true;
                            if (!t.isInvulnerable) {
                                t.hp = Math.max(0, t.hp - 15);
                                if (t === playerNoob && playerRole === "SURVIVOR") {
                                    hasSlowness = true; addStatusEffect("slow", "SLOWNESS I", "#aa66ff", 4);
                                    setTimeout(() => { hasSlowness = false; }, 4000);
                                    document.getElementById("hp-bar").style.width = t.hp + "%";
                                    if (t.hp <= 0) killPlayer();
                                } else if (t.hp <= 0) { t.alive = false; t.visible = false; }
                            }
                            scene.remove(proj); clearInterval(intv); break;
                        }
                    }
                    if (life <= 0) { scene.remove(proj); clearInterval(intv); }
                }, 16);
                setTimeout(() => { c00lState = "IDLE"; }, 400);
            }, 350);
        }

        function triggerPizzaDelivery() {
            if (minions.length >= 2) return;
            c00lState = "SUMMONING";
            c00lkidd.parts.lArm.rotation.x = -2.5; c00lkidd.parts.rArm.rotation.x = -2.5;

            const needed = 2 - minions.length;
            let minionsFinished = 0;

            for(let i = 0; i < needed; i++) {
                const offset = (i === 0) ? -4 : 4;
                const m = createR6(true);
                m.scale.set(0.65, 0.65, 0.65); m.isRising = true;
                m.position.set(c00lkidd.position.x + offset, -3, c00lkidd.position.z);
                scene.add(m); minions.push(m);

                let riseT = 0;
                const riseInterval = setInterval(() => {
                    m.position.y += 0.15; riseT++;
                    if (riseT >= 20) {
                        m.position.y = 0; m.isRising = false; clearInterval(riseInterval);
                        minionsFinished++;
                        if (minionsFinished === needed) {
                            setTimeout(() => {
                                c00lkidd.parts.lArm.rotation.x = 0; c00lkidd.parts.rArm.rotation.x = 0; c00lState = "IDLE";
                            }, 500);
                        }
                    }
                }, 40);

                m.despawnTimeout = setTimeout(() => {
                    const idx = minions.indexOf(m); if (idx > -1) minions.splice(idx, 1); scene.remove(m);
                }, 30000);
            }
        }

        function checkHitbox(target) {
            const relPos = target.position.clone().sub(c00lkidd.position);
            relPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), -c00lkidd.rotation.y);
            return (Math.abs(relPos.x) <= 2.2 && relPos.y >= -1 && relPos.y <= 5.5 && relPos.z <= 0.5 && relPos.z >= -5.5);
        }

        function animateWalkingLimbs(charGroup, cycleSpeed) {
            charGroup.walkCycle += cycleSpeed;
            charGroup.parts.lArm.rotation.x = Math.sin(charGroup.walkCycle) * 0.7;
            charGroup.parts.rArm.rotation.x = -Math.sin(charGroup.walkCycle) * 0.7;
            charGroup.parts.lLeg.rotation.x = -Math.sin(charGroup.walkCycle) * 0.7;
            charGroup.parts.rLeg.rotation.x = Math.sin(charGroup.walkCycle) * 0.7;
        }

        // =========================================================================
        // 9. GAME LOOP UTAMA (NGEBUT & RINGAN!)
        // =========================================================================
        let c00lAttackTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            torchLights.forEach(tl => { tl.intensity = 1.8 + Math.random() * 0.6; });
            if (keys["ArrowLeft"]) camYaw += 0.05;
            if (keys["ArrowRight"]) camYaw -= 0.05;

            // Tentukan karakter mana yang dikontrol Player (Noob atau c00lkidd)
            const controlledChar = (playerRole === "KILLER") ? c00lkidd : playerNoob;
            const canMove = (gameState === "INGAME" && (!isPlayerDead || playerRole === "KILLER"));

            if (canMove && !(playerRole === "KILLER" && c00lState !== "IDLE")) {
                // KECEPATAN NGEBUT NYAMAN!
                let spd = (playerRole === "KILLER" ? 0.25 : 0.23) * speedBoostMultiplier;
                
                if (playerRole === "SURVIVOR") {
                    if (playerNoob.isInvulnerable) spd *= 0.45;
                    else if (isDrinkingOrEating) spd *= 0.35;
                    else if (hasSlowness) spd *= 0.65;
                }

                if (isSprinting && stamina > 0 && !isDrinkingOrEating && !playerNoob.isInvulnerable) {
                    spd *= 1.6; stamina = Math.max(0, stamina - 0.4);
                } else {
                    stamina = Math.min(100, stamina + 0.25);
                }
                document.getElementById("stamina-bar").style.width = stamina + "%";

                let mx = 0, mz = 0;
                if (keys["KeyW"]) mz -= 1; if (keys["KeyS"]) mz += 1;
                if (keys["KeyA"]) mx -= 1; if (keys["KeyD"]) mx += 1;

                controlledChar.rotation.y = camYaw;

                if (mx !== 0 || mz !== 0) {
                    const angle = Math.atan2(mx, mz);
                    moveWithCollision(controlledChar, Math.sin(camYaw + angle) * spd, Math.cos(camYaw + angle) * spd);
                    animateWalkingLimbs(controlledChar, 0.22);
                } else if (!isDrinkingOrEating) {
                    controlledChar.parts.lArm.rotation.x = 0; controlledChar.parts.rArm.rotation.x = 0;
                    controlledChar.parts.lLeg.rotation.x = 0; controlledChar.parts.rLeg.rotation.x = 0;
                }
            }

            let camFocus = controlledChar;
            if (isSpectating && spectateList[spectateIdx]) camFocus = spectateList[spectateIdx];

            const cDist = 9;
            camera.position.x = camFocus.position.x + Math.sin(camYaw) * Math.cos(camPitch) * cDist;
            camera.position.z = camFocus.position.z + Math.cos(camYaw) * Math.cos(camPitch) * cDist;
            camera.position.y = camFocus.position.y + 3.5 + Math.sin(camPitch) * cDist;
            camera.lookAt(camFocus.position.x, camFocus.position.y + 3, camFocus.position.z);

            if (gameState === "INGAME") {
                // HITUNG JARAK AUDIO
                let audioDistance = 9999;
                if (playerRole === "SURVIVOR") {
                    if (!isPlayerDead) audioDistance = playerNoob.position.distanceTo(c00lkidd.position);
                    else if (isSpectating && camFocus) audioDistance = camFocus.position.distanceTo(c00lkidd.position);
                } else {
                    // Jika kamu jadi killer, jarak ke survivor terdekat
                    let minD = 9999;
                    [playerNoob, ...aiSurvivors].forEach(s => { if (s.alive) minD = Math.min(minD, s.position.distanceTo(c00lkidd.position)); });
                    audioDistance = minD;
                }
                update4LayerChase(audioDistance);

                // KUMPULKAN TARGET SURVIVOR
                let targets = [];
                if (playerRole === "SURVIVOR" && !isPlayerDead) targets.push(playerNoob);
                if (playerRole === "KILLER" && playerNoob.alive) targets.push(playerNoob); // Jika jadi killer, playerNoob jadi AI bot
                aiSurvivors.forEach(ai => { if (ai.alive) targets.push(ai); });

                let closestTarget = null;
                for (let t of targets) { if (t.isHighlighted) { closestTarget = t; break; } }
                if (!closestTarget) {
                    let minDist = 9999;
                    targets.forEach(t => {
                        const d = t.position.distanceTo(c00lkidd.position);
                        if (d < minDist) { minDist = d; closestTarget = t; }
                    });
                }

                // JIKA C00LKIDD DIKENDALIKAN AI (SAAT KAMU JADI SURVIVOR)
                if (playerRole === "SURVIVOR" && closestTarget) {
                    if (c00lState !== "SUMMONING") {
                        c00lkidd.lookAt(closestTarget.position.x, 0, closestTarget.position.z);
                        c00lkidd.rotation.y += Math.PI;
                    }

                    if (c00lState === "DASHING") {
                        dashTimer--;
                        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), c00lkidd.rotation.y);
                        moveWithCollision(c00lkidd, fwd.x * 0.9, fwd.z * 0.9);
                        if (checkHitbox(closestTarget) && !closestTarget.isInvulnerable) {
                            closestTarget.hp -= 32;
                            if (closestTarget === playerNoob) {
                                applyBurningToPlayer(8); document.getElementById("hp-bar").style.width = playerNoob.hp + "%";
                                if (playerNoob.hp <= 0) killPlayer();
                            } else if (closestTarget.hp <= 0) { closestTarget.alive = false; closestTarget.visible = false; }
                            c00lState = "IDLE";
                        }
                        if (dashTimer <= 0) c00lState = "IDLE";
                    } else if (c00lState === "IDLE") {
                        const kx = closestTarget.position.x - c00lkidd.position.x;
                        const kz = closestTarget.position.z - c00lkidd.position.z;
                        const kd = Math.sqrt(kx*kx + kz*kz);

                        // C00LKIDD LEBIH CEPAT (0.25) DARI AI (0.21) -> PASTI TERKEJAR!
                        if (kd > 3.5) {
                            moveWithCollision(c00lkidd, (kx / kd) * 0.25, (kz / kd) * 0.25);
                            animateWalkingLimbs(c00lkidd, 0.22);
                        }

                        if (c00lAttackTimer <= 0 && checkHitbox(closestTarget)) {
                            c00lAttackTimer = 110;
                            c00lkidd.parts.rArm.rotation.x = -1.6;
                            if (!closestTarget.isInvulnerable) {
                                closestTarget.hp -= 26.5;
                                if (closestTarget === playerNoob) {
                                    document.getElementById("hp-bar").style.width = playerNoob.hp + "%";
                                    if (playerNoob.hp <= 0) killPlayer();
                                } else if (closestTarget.hp <= 0) { closestTarget.alive = false; closestTarget.visible = false; }
                            }
                            setTimeout(() => { c00lkidd.parts.rArm.rotation.x = 0; }, 300);
                        }

                        c00lAbilitiesTimer++;
                        if (c00lAbilitiesTimer === 450) triggerWalkspeedOverride();
                        if (c00lAbilitiesTimer === 900) triggerCorruptNature(closestTarget);
                        if (c00lAbilitiesTimer === 1350) { triggerPizzaDelivery(); c00lAbilitiesTimer = 0; }
                    }
                } else if (playerRole === "KILLER" && c00lState === "DASHING") {
                    // DASH SAAT PLAYER JADI KILLER
                    dashTimer--;
                    const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), c00lkidd.rotation.y);
                    moveWithCollision(c00lkidd, fwd.x * 0.9, fwd.z * 0.9);
                    targets.forEach(t => {
                        if (checkHitbox(t)) {
                            t.hp -= 32; if (t.hp <= 0) { t.alive = false; t.visible = false; }
                            c00lState = "IDLE";
                        }
                    });
                    if (dashTimer <= 0) c00lState = "IDLE";
                }
                if (c00lAttackTimer > 0) c00lAttackTimer--;

                // MINIONS
                for (let i = minions.length - 1; i >= 0; i--) {
                    const m = minions[i];
                    if (m.isRising || !closestTarget) continue;
                    m.lookAt(closestTarget.position.x, 0, closestTarget.position.z); m.rotation.y += Math.PI;
                    const mx = closestTarget.position.x - m.position.x, mz = closestTarget.position.z - m.position.z;
                    const md = Math.sqrt(mx*mx + mz*mz);

                    if (md > 2.5) {
                        moveWithCollision(m, (mx / md) * 0.14, (mz / md) * 0.14);
                        animateWalkingLimbs(m, 0.24);
                    } else {
                        clearTimeout(m.despawnTimeout); scene.remove(m); minions.splice(i, 1);
                        applyHighlight(closestTarget);
                        if (!closestTarget.isInvulnerable) {
                            closestTarget.hp -= 15;
                            if (closestTarget === playerNoob && playerRole === "SURVIVOR") {
                                hasSlowness = true; addStatusEffect("slow", "SLOWNESS II", "#aa66ff", 3);
                                setTimeout(() => { hasSlowness = false; }, 3000);
                                applyBurningToPlayer(3); document.getElementById("hp-bar").style.width = playerNoob.hp + "%";
                                if (playerNoob.hp <= 0) killPlayer();
                            } else if (closestTarget.hp <= 0) { closestTarget.alive = false; closestTarget.visible = false; }
                        }
                    }
                }

                // AI SURVIVOR MOVEMENT (TERMASUK PLAYERNOOB BOT SAAT JADI KILLER)
                const botList = (playerRole === "KILLER") ? [playerNoob, ...aiSurvivors] : aiSurvivors;
                botList.forEach(ai => {
                    if (ai.alive) {
                        const distToKiller = ai.position.distanceTo(c00lkidd.position);
                        let aiSpeed = (distToKiller < 35 || ai.isHighlighted) ? 0.21 : 0.13; // Lebih lambat dari c00lkidd (0.25)

                        if (distToKiller < 35 || ai.isHighlighted) {
                            const adx = ai.position.x - c00lkidd.position.x, adz = ai.position.z - c00lkidd.position.z;
                            const dist = Math.sqrt(adx*adx + adz*adz);
                            moveWithCollision(ai, (adx / dist) * aiSpeed, (adz / dist) * aiSpeed);
                            ai.lookAt(ai.position.x + adx, 0, ai.position.z + adz); ai.rotation.y += Math.PI;
                            animateWalkingLimbs(ai, 0.24);
                        } else {
                            if (!ai.patrolTarget) ai.patrolTarget = new THREE.Vector3();
                            const pdx = ai.patrolTarget.x - ai.position.x, pdz = ai.patrolTarget.z - ai.position.z;
                            const pdist = Math.sqrt(pdx*pdx + pdz*pdz);
                            if (pdist > 2) {
                                moveWithCollision(ai, (pdx / pdist) * aiSpeed, (pdz / pdist) * aiSpeed);
                                ai.lookAt(ai.patrolTarget.x, 0, ai.patrolTarget.z); ai.rotation.y += Math.PI;
                                animateWalkingLimbs(ai, 0.16);
                            } else { pickNewPatrol(ai); }
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }
        animate();
        updateUIState();
    </script>
</body>
